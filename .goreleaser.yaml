version: 2

project_name: amo

before:
  hooks:
    - go mod tidy

builds:
  - id: amo
    binary: amo
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux # amo reads /proc via a linux-only procscan build; other OSes won't compile
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X agentmon/internal/render.Version={{ .Version }}

archives:
  - id: amo
    formats: [tar.gz]
    # version-less name so curl installs can hit the stable
    # releases/latest/download/amo_linux_<arch>.tar.gz URL
    name_template: "amo_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^Merge "

release:
  draft: false
  footer: |
    ## Install

    ```sh
    curl -fsSL https://raw.githubusercontent.com/HQuan1428/agentmon/main/install.sh | sh
    ```

    Linux amd64/arm64. See the [README](https://github.com/HQuan1428/agentmon#readme) for usage.
